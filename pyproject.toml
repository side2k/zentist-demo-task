[project]
name = "trial-task"
version = "0.1.0"
description = ""
authors = [
    {name = "Leonid Amirov",email = "leonid.amirov@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp (>=3.14.1,<4.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aiosmtplib (>=5.1.2,<6.0.0)",
]

[dependency-groups]
dev = [
    "ruff (==0.15.21)",
]
test = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "faker (>=40.31.0,<41.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not e2e_staging'"
markers = [
    "e2e_staging: end-to-end tests against the live staging portal (opt-in)",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN204", # Missing return type annotation for special method `__init__`
    "D107", # Missing docstring in `__init__`
    "D202", # No blank lines allowed after function docstring (found 1)
    "D203", # Incompatible with D211 - using D211 instead
    "D213", # Incompatible with D212 - using D212 instead
    "D401", # First line of docstring should be in imperative mood
    "G004", # Logging statement uses f-string
    "TRY003", # Avoid specifying long messages outside the exception class
    "EM101", # Exception must not use a string literal, assign to variable first
    "EM102", # Exception must not use an f-string literal, assign to variable first

]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "S101", # Use of assert (expected in tests)
    "S105", # Possible hardcoded password (public demo credentials)
    "S106", # Possible hardcoded password (public demo credentials)
    "PLR2004", # Magic value in comparison (fine in tests)
]
"alembic/versions/**" = [
    "D", # docstrings
    "INP001", # missing __init__
    "UP007", # Use `X | Y` for type annotations
    "UP035", # Import from `collections.abc` instead: `Sequence`

]
